<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>测测你更像《西游记》里的谁？· 趣味测试</title>
<style>
  :root{
    --bg:#F6F5F1;
    --card:#FFFFFF;
    --ink:#2B2925;
    --sub:#8A8578;
    --line:#ECE8DF;
    --accent:#DE5A26;
    --accent-soft:#FCF0E8;
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    line-height:1.7;
    padding:28px 18px 48px;
  }
  .wrap{max-width:560px;margin:0 auto}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 24px;
  }
  .pill{
    display:inline-block;
    font-size:12px;
    color:var(--accent);
    background:var(--accent-soft);
    border-radius:999px;
    padding:4px 12px;
    letter-spacing:.08em;
  }
  h1{font-size:27px;line-height:1.45;font-weight:700;margin:16px 0 12px}
  .intro{color:#5C574C;font-size:15px;margin-bottom:10px}
  .fine{color:var(--sub);font-size:12.5px;margin-top:18px}
  .btn{
    display:block;width:100%;
    border:none;cursor:pointer;
    background:var(--accent);color:#fff;
    font-size:16.5px;font-weight:600;
    border-radius:14px;
    padding:15px 0;
    margin-top:24px;
    letter-spacing:.06em;
  }
  .btn:active{opacity:.85}
  .btn.ghost{
    background:var(--card);color:var(--ink);
    border:1px solid var(--line);
  }
  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .qcount{font-size:13px;color:var(--sub);letter-spacing:.05em}
  .bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:24px}
  .bar > div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
  .qtext{font-size:19.5px;font-weight:600;line-height:1.6;margin-bottom:8px}
  .qhint{font-size:13px;color:var(--sub);margin-bottom:20px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    font-size:15.5px;line-height:1.6;
    transition:border-color .15s,background .15s;
    user-select:none;
  }
  .opt .k{
    flex:0 0 auto;
    width:24px;height:24px;border-radius:50%;
    border:1px solid var(--line);
    color:var(--sub);
    font-size:12.5px;
    display:flex;align-items:center;justify-content:center;
    margin-top:2px;
    background:#fff;
  }
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
  .back{
    display:inline-block;margin-top:10px;
    color:var(--sub);font-size:14px;cursor:pointer;background:none;border:none;padding:6px 0;
  }
  /* result */
  .rlabel{font-size:13px;color:var(--sub);letter-spacing:.1em}
  .rname{font-size:30px;font-weight:700;margin:8px 0 2px}
  .rsub{font-size:16.5px;color:var(--accent);font-weight:600;margin-bottom:14px}
  .rlead{font-size:16.5px;font-weight:600;line-height:1.65;margin-bottom:16px}
  .replay{
    background:var(--accent-soft);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px;line-height:1.65;
    margin-bottom:16px;
  }
  .score-line{font-size:14px;color:#5C574C;margin-bottom:6px}
  .tie{
    font-size:13.5px;color:#5C574C;
    border:1px dashed var(--line);
    border-radius:12px;padding:10px 14px;margin:12px 0 4px;
    line-height:1.65;
  }
  .rbody{font-size:15px;color:#3D3A33;margin-top:14px}
  .quote{
    margin-top:20px;
    background:#FBFAF7;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-size:15px;
  }
  .quote .qt{color:var(--sub);font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
  .scores{margin-top:22px}
  .scores .st{font-size:13px;color:var(--sub);letter-spacing:.1em;margin-bottom:10px}
  .srow{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:8px}
  .srow .nm{flex:0 0 52px}
  .srow .tr{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .srow .tr > div{height:100%;background:#CFC8B8;border-radius:99px}
  .srow.me .tr > div{background:var(--accent)}
  .srow .ct{flex:0 0 20px;text-align:right;color:var(--sub)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- 开始页 -->
  <section id="screen-start" class="card">
    <span class="pill">趣味测试 · 12 道题</span>
    <h1>测测你更像《西游记》里的谁？</h1>
    <p class="intro">12 道日常情境题，看看一群人遇到事时，你习惯从哪里入手。</p>
    <p class="intro">请按最近几个月的实际做法来选。每题单选。如果几项都像你，选你最可能先做、或做得最自然的那一项。没遇过类似情况，就选你觉得自己最顺手的做法。</p>
    <button class="btn" id="btn-start">开始测试</button>
    <p class="fine">本测试为趣味娱乐，非专业心理测评，仅供自我探索参考。</p>
  </section>

  <!-- 答题页 -->
  <section id="screen-quiz" class="card hidden">
    <div class="qhead"><span class="qcount" id="q-count">第 1 / 12 题</span></div>
    <div class="bar"><div id="q-bar" style="width:8.3%"></div></div>
    <div class="qtext" id="q-text"></div>
    <div class="qhint">选最像你的那一个（单选）</div>
    <div id="q-opts"></div>
    <button class="back hidden" id="btn-back">← 上一题</button>
  </section>

  <!-- 结果页 -->
  <section id="screen-result" class="card hidden">
    <div class="rlabel">你更像《西游记》里的</div>
    <div class="rname" id="r-name"></div>
    <div class="rsub" id="r-sub"></div>
    <div class="rlead" id="r-lead"></div>
    <div class="replay" id="r-replay"></div>
    <div class="score-line" id="r-scoreline"></div>
    <div class="tie hidden" id="r-tie"></div>
    <p class="rbody" id="r-p1"></p>
    <p class="rbody" id="r-p2"></p>
    <div class="quote"><span class="qt">晒图短句</span><span id="r-quote"></span></div>
    <div class="scores">
      <div class="st">六位得分</div>
      <div id="r-scores"></div>
    </div>
    <button class="btn" id="btn-share">分享结果</button>
    <button class="btn ghost" id="btn-again">再测一次</button>
    <p class="fine">趣味测试，仅供自我探索参考。</p>
  </section>

</div>

<script>
var LETTERS = ["A","B","C","D","E","F"];
var idx = 0;
var answers = [];
var locked = false;
var lastResult = null;

function $(id){ return document.getElementById(id); }
function show(id){
  ["screen-start","screen-quiz","screen-result"].forEach(function(s){
    $(s).classList.toggle("hidden", s !== id);
  });
  window.scrollTo(0,0);
}

function render(){
  var q = QUESTIONS[idx];
  $("q-count").textContent = "第 " + (idx+1) + " / 12 题";
  $("q-bar").style.width = ((idx+1)/12*100) + "%";
  $("q-text").textContent = q.t;
  var box = $("q-opts");
  box.innerHTML = "";
  q.o.forEach(function(text, i){
    var d = document.createElement("div");
    d.className = "opt" + (answers[idx] === i ? " sel" : "");
    var k = document.createElement("span");
    k.className = "k"; k.textContent = LETTERS[i];
    var s = document.createElement("span");
    s.textContent = text;
    d.appendChild(k); d.appendChild(s);
    d.addEventListener("click", function(){ pick(i, d); });
    box.appendChild(d);
  });
  $("btn-back").classList.toggle("hidden", idx === 0);
}

function pick(i, el){
  if (locked) return;
  locked = true;
  answers[idx] = i;
  var opts = $("q-opts").children;
  for (var j = 0; j < opts.length; j++) opts[j].classList.toggle("sel", j === i);
  setTimeout(function(){
    locked = false;
    if (idx < 11) { idx++; render(); }
    else { compute(); }
  }, 240);
}

function lastQ(role, ans){
  for (var q = 11; q >= 0; q--){
    if (QUESTIONS[q].m[ans[q]] === role) return q;
  }
  return -1;
}

function compute(){
  var scores = {wu:0, jie:0, sha:0, seng:0, long:0, yin:0};
  answers.forEach(function(a, q){ scores[QUESTIONS[q].m[a]]++; });
  var max = 0;
  ORDER.forEach(function(r){ if (scores[r] > max) max = scores[r]; });
  var tied = ORDER.filter(function(r){ return scores[r] === max; });
  var main = tied[0];
  if (tied.length > 1){
    for (var q = 11; q >= 0; q--){
      var role = QUESTIONS[q].m[answers[q]];
      if (tied.indexOf(role) >= 0) { main = role; break; }
    }
  }
  var others = tied.filter(function(r){ return r !== main; });
  others.sort(function(a, b){ return lastQ(b, answers) - lastQ(a, answers); });

  /* 答题回放：主角色对应的已选答案，优先第 1、4、7、9 题里最靠后的 */
  var mine = [];
  answers.forEach(function(a, q){ if (QUESTIONS[q].m[a] === main) mine.push(q); });
  var pref = mine.filter(function(q){ return [0,3,6,8].indexOf(q) >= 0; });
  var rq = (pref.length ? pref : mine)[(pref.length ? pref : mine).length - 1];
  var replay = "第 " + (rq+1) + " 题，你选了『" + QUESTIONS[rq].o[answers[rq]] + "』";

  var R = ROLES[main];
  lastResult = {main: main, scores: scores};
  $("r-name").textContent = R.name;
  $("r-sub").textContent = R.sub;
  $("r-lead").textContent = R.lead;
  $("r-replay").textContent = replay;
  $("r-scoreline").textContent = "12 题中，有 " + scores[main] + " 次选中了对应「" + R.name + "」的做法。";
  if (tied.length > 1){
    var names = others.map(function(r){ return ROLES[r].name; }).join("、");
    $("r-tie").textContent = "这次有 " + tied.length + " 个角色并列最高，每个角色对应的做法都选了 " + max + " 次。" +
      (names ? "另外并列的还有：" + names + "。" : "");
    $("r-tie").classList.remove("hidden");
  } else {
    $("r-tie").classList.add("hidden");
  }
  $("r-p1").textContent = R.p1;
  $("r-p2").textContent = R.p2;
  $("r-quote").textContent = R.quote;
  var sb = $("r-scores");
  sb.innerHTML = "";
  ORDER.forEach(function(r){
    var row = document.createElement("div");
    row.className = "srow" + (r === main ? " me" : "");
    row.innerHTML = "";
    var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = ROLES[r].name;
    var tr = document.createElement("span"); tr.className = "tr";
    var fill = document.createElement("div"); fill.style.width = (scores[r]/12*100) + "%";
    tr.appendChild(fill);
    var ct = document.createElement("span"); ct.className = "ct"; ct.textContent = scores[r];
    row.appendChild(nm); row.appendChild(tr); row.appendChild(ct);
    sb.appendChild(row);
  });
  show("screen-result");
}

$("btn-start").addEventListener("click", function(){
  idx = 0; answers = [];
  show("screen-quiz");
  render();
});
$("btn-back").addEventListener("click", function(){
  if (idx > 0) { idx--; render(); }
});
$("btn-again").addEventListener("click", function(){
  idx = 0; answers = [];
  show("screen-start");
});
$("btn-share").addEventListener("click", function(){
  if (!lastResult) return;
  var R = ROLES[lastResult.main];
  var text = "我测出来更像《西游记》里的" + R.name + "——" + R.sub + "。" + R.quote;
  var url = location.href;
  if (navigator.share) {
    navigator.share({title: document.title, text: text, url: url}).catch(function(){});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text + " " + url).then(function(){
      var b = $("btn-share");
      b.textContent = "已复制，去粘贴分享吧";
      setTimeout(function(){ b.textContent = "分享结果"; }, 2000);
    }).catch(function(){});
  }
});
</script>
</body>
</html>
