{t:"出门旅行",q:"出门旅行，你的行程风格是？",opts:[["不做攻略，走到哪算哪，刺激优先","悟"],["攻略全是吃的，景点随缘","戒"],["提前查好路线车次，一项不落","沙"],["有明确的目的地和必打卡清单，不达目的不罢休","僧"],["跟着大家走，你们去哪我去哪","龙"],["我负责拍照订票看孩子，大管家本家","音"]]},
{t:"别人眼中的你",q:"别人对你最常见的评价是？",opts:[["本事大，就是脾气也大","悟"],["心态真好，跟他在一起没烦恼","戒"],["靠谱，交给他的事不用操心","沙"],["有股韧劲，认准的事谁劝都不听","僧"],["存在感不强，但少了他真不行","龙"],["会做人，谁跟他相处都舒服","音"]]},
{t:"死活解不开的难题",q:"碰到一个死活解决不了的难题，你会？",opts:[["硬啃，啃不动就换个姿势继续啃","悟"],["先放一放，说不定睡一觉就有办法了","戒"],["一点一点磨，笨办法也是办法","沙"],["先想清楚这事到底值不值得，非做不可就耗到底","僧"],["找人帮忙不丢人，我去搬救兵","音"],["不声不响自己扛，实在扛不住再说","龙"]]},
{t:"交朋友",q:"你交朋友最看重什么？",opts:[["真本事，相处起来过瘾","悟"],["好相处，在一起开心最重要","戒"],["踏实，不玩虚的","沙"],["人品正，三观合得来","僧"],["不争不抢，相处没压力","龙"],["善良，谁落难他都愿意搭把手","音"]]},
{t:"取经队伍里的位置",q:"如果西天取经的队伍里必须有你，你最想当哪个位置？",opts:[["开路的，妖怪来了第一个上","悟"],["管气氛的，再难的路也要笑着走","戒"],["挑担的，脏活累活我来","沙"],["带队的，方向不能错","僧"],["托底的，平时不出声，关键时刻顶上","龙"],["不在队里，但全队有难时随叫随到","音"]]}
];
const LETTERS=["A","B","C","D","E","F"];

let idx=0; const answers=[]; let answerLocked=false; let shareReturnFocus=null;
const $=id=>document.getElementById(id);
function show(id){["screen-start","screen-quiz","screen-result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));const el=$(id);el.style.animation="none";void el.offsetWidth;el.style.animation="";window.scrollTo(0,0);}
function renderQ(){
  const cur=QUESTIONS[idx];
  answerLocked=false;
  $("bar").style.width=((idx+1)/QUESTIONS.length*100)+"%";
  $("bar").parentElement.setAttribute("aria-valuenow",String(idx+1));
  $("qcount").textContent="第 "+(idx+1)+" / "+QUESTIONS.length+" 题";
  $("qtitle").textContent=cur.t;
  $("qtext").textContent=cur.q;
  const box=$("opts"); box.innerHTML="";
  cur.opts.forEach(([txt,role],oi)=>{
    const b=document.createElement("button"); b.className="opt"; b.style.animationDelay=(oi*0.04)+"s";
    b.innerHTML='<span class="k">'+LETTERS[oi]+'</span>'+txt;
    if(answers[idx]===role) b.classList.add("picked");
    b.setAttribute("aria-pressed",String(answers[idx]===role));
    b.onclick=()=>{if(answerLocked)return; answerLocked=true; box.querySelectorAll("button").forEach(x=>x.disabled=true); answers[idx]=role; b.classList.add("picked"); b.setAttribute("aria-pressed","true"); setTimeout(()=>{ idx++; if(idx<QUESTIONS.length){renderQ();} else {showResult();} },180);};
    box.appendChild(b);
  });
  $("btnBack").style.visibility = idx===0 ? "hidden":"visible";
  $("btnBack").disabled = idx===0;
  $("qtext").focus({preventScroll:true});
}
function compute(){
  const counts={}; ORDER.forEach(r=>counts[r]=0);
  answers.forEach(r=>{ if(r) counts[r]++; });
  const max=Math.max(...ORDER.map(r=>counts[r]));
  const tied=ORDER.filter(r=>counts[r]===max);
  let winner=tied[0], sub=null;
  if(tied.length>1){
    const q12=answers[11];
    if(q12 && tied.includes(q12)) winner=q12;
    sub=tied.find(r=>r!==winner);
  }
  return {counts,winner,sub,max};
}
let lastCard=null;
function showResult(){
  const c=compute();
  const r=ROLES[c.winner];
  lastCard={r,sub:c.sub?ROLES[c.sub]:null,counts:c.counts};
  $("rname").textContent=r.name+" · "+r.type;
  $("rquote").textContent="“"+r.quote+"”";
  $("rsub").textContent = c.sub ? ("副型："+ROLES[c.sub].name+" · "+ROLES[c.sub].type+"——你身上也有它的一面。") : "";
  $("rsub").style.display = c.sub ? "" : "none";
  $("rtags").innerHTML=r.tags.map(t=>"<span>"+t+"</span>").join("");
  $("rscore").innerHTML=ORDER.map(k=>{
    const v=c.counts[k];
    return '<div class="scorerow"><div class="sl">'+ROLES[k].name+'</div><div class="st"><i style="width:'+Math.round(v/12*100)+'%"></i></div><div class="sv">'+v+'</div></div>';
  }).join("");
  $("rbase").textContent=r.base;
  $("rstyle").textContent=r.style;
  $("rstrength").textContent=r.strength;
  $("rpit").textContent=r.pit;
  $("rmatch").textContent=r.match;
  $("rword").textContent=r.word;
  show("screen-result");
}
function wrap(ctx,text,x,y,maxW,lh){let line="",yy=y;for(const ch of text){if(ctx.measureText(line+ch).width>maxW&&line){ctx.fillText(line,x,yy);line=ch;yy+=lh;}else{line+=ch;}}ctx.fillText(line,x,yy);return yy;}
function makeCard(){
  const r=lastCard.r; const cv=$("cv"); const ctx=cv.getContext("2d");
  const g=ctx.createLinearGradient(0,0,0,1440); g.addColorStop(0,"#16233f"); g.addColorStop(0.55,"#0e1a33"); g.addColorStop(1,"#0a1428");
  ctx.fillStyle=g; ctx.fillRect(0,0,1080,1440);
  ctx.strokeStyle="#d4af37"; ctx.lineWidth=6; ctx.strokeRect(36,36,1008,1368);
  ctx.fillStyle="#d4af37"; ctx.beginPath(); ctx.arc(880,190,260,0,7); ctx.globalAlpha=.10; ctx.fill(); ctx.beginPath(); ctx.arc(140,1270,210,0,7); ctx.globalAlpha=.08; ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle="#e8c96a"; ctx.font="600 40px sans-serif"; ctx.fillText("🐵 你是西游记里的哪一位",90,190);
  ctx.fillStyle="#9fb0d0"; ctx.font="34px sans-serif"; ctx.fillText("12 道题 · 趣味测试结果卡",90,250);
  const ng=ctx.createLinearGradient(90,0,990,0); ng.addColorStop(0,"#e8c96a"); ng.addColorStop(1,"#d4af37"); ctx.fillStyle=ng; ctx.font="bold 112px serif"; wrap(ctx,r.name+" · "+r.type,90,470,900,135);
  ctx.fillStyle="#f5ead0"; ctx.font="44px sans-serif"; wrap(ctx,"“"+r.quote+"”",90,650,880,64);
  ctx.font="600 38px sans-serif"; ctx.fillStyle="#e8c96a"; ctx.fillText(r.tags.map(t=>"# "+t).join("   "),90,860);
  ctx.fillStyle="#f5ead0"; ctx.font="38px sans-serif"; wrap(ctx,r.word,90,980,880,58);
  ctx.fillStyle="#9fb0d0"; ctx.font="30px sans-serif";
  if(lastCard.sub) ctx.fillText("副型："+lastCard.sub.name+" · "+lastCard.sub.type,90,1200);
  ctx.fillText("趣味娱乐测试 · 非专业心理测评 · 仅供自我探索参考",90,1255);
  ctx.fillText("测测你是哪一位，截图分享给朋友",90,1330);
  $("cardImg").src=cv.toDataURL("image/png");
  shareReturnFocus=document.activeElement;
  $("cardModal").classList.remove("hidden");
  document.body.style.overflow="hidden";
  $("btnDownloadCard").focus();
}
function closeCard(){
  $("cardModal").classList.add("hidden"); document.body.style.overflow="";
  if(shareReturnFocus && shareReturnFocus.focus) shareReturnFocus.focus();
}
async function downloadCard(){
  if(!lastCard)return;
  const a=document.createElement("a"); a.href=$("cardImg").src; a.download="我的西游测试结果.png"; a.click();
}
async function shareCard(){
  if(!lastCard)return;
  try{
    const blob=await (await fetch($("cardImg").src)).blob();
    const file=new File([blob],"我的西游测试结果.png",{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({title:"我的西游测试结果",text:"我测出是西游记里的："+lastCard.r.name,files:[file]});
      return;
    }
  }catch(e){ if(e.name==="AbortError")return; }
  await downloadCard(); $("shareHint").textContent="此浏览器暂不支持直接分享，结果图片已开始下载。";
}
$("btnStart").onclick=()=>{idx=0;answers.length=0;show("screen-quiz");renderQ();};
$("btnBack").onclick=()=>{if(idx>0&&!answerLocked){idx--;renderQ();}};
$("btnAgain").onclick=()=>{idx=0;answers.length=0;show("screen-quiz");renderQ();};
$("btnCard").onclick=makeCard;
$("btnDownloadCard").onclick=downloadCard;
$("btnShareCard").onclick=shareCard;
$("btnCloseCard").onclick=closeCard;
$("cardModal").addEventListener("click",e=>{if(e.target===$("cardModal"))closeCard();});
document.addEventListener("keydown",e=>{const modal=$("cardModal");if(modal.classList.contains("hidden"))return;if(e.key==="Escape"){closeCard();return;}if(e.key==="Tab"){const items=[...modal.querySelectorAll("button")];const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
</script>
