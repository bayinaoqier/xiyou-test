<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测测你更像《西游记》里的谁？</title>
<meta name="description" content="用 12 道日常情境题，找找你在取经队伍里的位置。">
<style>
:root {
  color-scheme: light;
  --paper: #fcf8f1;
  --white: #fffcf7;
  --ink: #29211d;
  --muted: #6c5c53;
  --red: #a83226;
  --deep-red: #86291f;
  --line: #e6d9ce;
  --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: #eee8df; color: var(--ink); }
[hidden] { display: none !important; }
h1, h2, p, blockquote { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.shell { width: 100%; max-width: 432px; min-height: 100vh; margin-inline: auto; padding-inline: 22px; background: var(--paper); }
.site-head { display: flex; align-items: center; gap: 9px; min-height: 63px; border-bottom: 1px solid var(--line); }
.seal { display: grid; place-items: center; width: 27px; height: 29px; border-radius: 4px; background: var(--red); color: var(--white); font: 700 17px var(--serif); }
.brand { font: 700 17px var(--serif); letter-spacing: .08em; }
.edition { margin-left: auto; color: var(--muted); font-size: 11px; letter-spacing: .12em; }
main { padding-top: 24px; }
.kicker { display: flex; align-items: center; gap: 7px; color: var(--red); font-size: 11px; font-weight: 700; letter-spacing: .18em; }
.kicker::before { content: ""; width: 6px; height: 6px; background: currentColor; transform: rotate(45deg); }
.cover h1 { margin-block: 10px 9px; font: 800 clamp(32px, 10.6vw, 45px)/1.15 var(--serif); letter-spacing: -.04em; }
.cover h1 span { display: block; color: var(--red); }
.intro { color: var(--muted); font-size: 13px; line-height: 1.65; }
.art { margin-block: 18px 15px; overflow: hidden; border-radius: 9px; border: 1px solid #ead8bd; }
.art img { display: block; width: 100%; height: auto; }
.tags { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; color: var(--muted); font-size: 12px; }
.tags span + span::before { content: "·"; margin-right: 10px; color: var(--red); }
.primary, .secondary { min-height: 46px; padding: 10px 15px; border-radius: 7px; font-size: 14px; font-weight: 650; }
.primary { color: var(--white); background: var(--red); border: 1px solid var(--red); }
.primary:hover:not(:disabled) { background: var(--deep-red); }
.primary:disabled { cursor: default; color: #74655c; background: #eee4da; border-color: #eee4da; }
.start { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; min-height: 49px; }
.start::before { content: ""; }
.start span { justify-self: end; font-size: 18px; line-height: 1; }
.secondary { color: var(--deep-red); background: transparent; border: 1px solid #dac6b9; }
.secondary:hover { background: #f5ebe2; }
.foot { padding-block: 18px 22px; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.65; }
.panel { margin-inline: auto; }
.progress-label { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.progress-label strong { color: var(--red); }
.track { height: 4px; margin-top: 9px; border-radius: 6px; background: #eadfd5; overflow: hidden; }
.track span { display: block; height: 100%; width: 0; background: var(--red); border-radius: inherit; transition: width .2s ease; }
#question-title { margin-block: 20px 6px; font-size: 21px; line-height: 1.48; }
.hint { color: var(--muted); margin-bottom: 15px; font-size: 13px; line-height: 1.6; }
.choices { display: grid; gap: 8px; }
.choice { position: relative; display: grid; grid-template-columns: 24px 1fr 14px; gap: 9px; align-items: center; min-height: 48px; padding: 9px 11px; background: var(--white); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1.5; }
@media (hover: hover) { .choice:hover { background: #faf0e6; } }
.choice:has(:checked) { background: #faece4; border-color: #b76858; }
.choice:has(:focus-visible) { outline: 2px solid var(--red); outline-offset: 2px; }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.letter { display: grid; place-items: center; width: 23px; height: 23px; border-radius: 4px; color: #7d4938; background: #f4e9dd; font-size: 12px; font-weight: 700; }
.choice:has(:checked) .letter { background: var(--red); color: var(--white); }
.indicator { width: 14px; height: 14px; border: 1px solid #a38c80; border-radius: 50%; }
.choice:has(:checked) .indicator { background: var(--red); border: 3px solid #faece4; outline: 1px solid var(--red); }
.actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
.actions .primary { margin-left: auto; }
.result-head { padding: 20px; background: #f4e4d6; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.result-head h2 { font: 800 clamp(35px, 10vw, 46px)/1.15 var(--serif); margin-block: 8px 5px; }
#result-type { color: #6e4539; font-size: 14px; }
.result-seal { flex: none; width: 63px; aspect-ratio: 1; display: grid; place-items: center; border: 2px solid var(--red); outline: 1px solid var(--red); outline-offset: -5px; border-radius: 7px; transform: rotate(-7deg); color: var(--red); font: 800 38px var(--serif); }
.result-body { padding-top: 18px; }
.result-body p { font-size: 15px; line-height: 1.8; }
#result-lead { font-weight: 700; font-size: 16px; }
.replay { border-left: 2px solid var(--red); padding: 9px 12px; margin-block: 15px 17px; background: #f7ece1; border-radius: 0 6px 6px 0; }
.replay span, .share span { color: var(--red); font-size: 12px; font-weight: 650; }
.replay p { margin-top: 3px; font-size: 14px; }
#result-detail p + p { margin-top: 11px; }
.result-body .tie { margin-top: 15px; font-size: 13px; color: var(--muted); }
.share { margin-top: 18px; padding-block: 11px; border-block: 1px solid var(--line); }
.share blockquote { margin-top: 5px; font: 700 19px/1.6 var(--serif); }
@media (max-width: 350px) {
  .shell { padding-inline: 16px; }
  main { padding-top: 20px; }
  .choice { padding-inline: 8px; }
  .result-head { padding: 15px; }
}
@media (prefers-reduced-motion: reduce) { .track span { transition: none; } }
</style>
</head>

<script type="application/json" id="quiz-data">{"questions": [{"title": "临时接到一个明天就要交的多人任务。刚看完消息，你最可能先做什么？", "choices": ["挑个卡住的地方，先做个小样看看能不能跑通。", "看看哪些地方能用现成材料，先把工作量降下来。", "列出自己要交的东西，先做最容易拖到最后的那项。", "问清楚明天交上去至少得达到什么要求。", "看看哪块还没人认领，先接一件自己做得来的。", "让大家各说一句最缺什么，免得几个人同时卡在一处。"], "roles": ["悟", "戒", "沙", "僧", "龙", "音"]}, {"title": "几个人约好周末见面，有人嫌远，有人只有两小时。你更可能怎么接话？", "choices": ["把大家能到的时间和路程对一遍，找个好订位的方案。", "先确认这次是为了见谁或做什么，围绕那件事定安排。", "问问那个行程最赶的人，要不要我顺路接一下。", "把在意路程的和在意时间的顾虑说清，看看能不能各让一点。", "直接提一个新地点，问大家要不要就试这家。", "挑个能坐下来吃点东西的地方，其他安排随当天状态。"], "roles": ["沙", "僧", "龙", "音", "悟", "戒"]}, {"title": "你花了不少时间准备的方案被退回，还有人等着用这份材料。接下来半小时，你多半会做什么？", "choices": ["先把还能用的部分发给等材料的人，免得他们也停在原地。", "找提出意见的人聊几句，弄清双方卡在了哪里。", "抓住最有争议的一点，换个办法试出来给人看。", "先去走走或吃点东西，等自己缓过来再开文档。", "把反馈逐条对上原稿，标出具体要改的地方。", "回看最初想解决的问题，想清楚哪些改动值得接受。"], "roles": ["龙", "音", "悟", "戒", "沙", "僧"]}, {"title": "几个人在群里讨论一件事，话越说越冲。你也在群里，最可能做什么？", "choices": ["提议先歇十分钟，等大家缓一缓再回来聊。", "把已确认的事和待确认的事列出来，先照已定的部分做。", "提醒大家原先约好的规则，问现在是否还按那个来。", "私聊那个明显忙不过来的人，问他有没有一件事能交给我。", "把双方各自的顾虑复述一遍，问问我理解得对不对。", "把有争议的那一点挑出来，直接说我的看法。"], "roles": ["戒", "沙", "僧", "龙", "音", "悟"]}, {"title": "出门旅行时，原定的活动临时取消。同行的人都还在等下一步，你更可能做什么？", "choices": ["想想大家这趟最期待什么，看看附近有没有类似的安排。", "看看谁带着行李或已经走累了，先替他分担一点。", "问清有人想走、有人想留的原因，看能不能分开活动再会合。", "在附近找个没去过的地方，提议直接过去看看。", "找家店坐一会儿，把空出来的时间当成休息。", "查好替代地点的开放时间、交通和剩余名额。"], "roles": ["僧", "龙", "音", "悟", "戒", "沙"]}, {"title": "朋友做一件事遇到困难，来找你聊。听完以后，你更自然的反应是什么？", "choices": ["先确认他现在想有人听，还是想一起商量下一步。", "挑出最卡的一步，陪他当场试一个新办法。", "先带他去做点轻松的事，等他有劲了再聊。", "陪他把待办排个顺序，看看哪件今天能做完。", "问他最想守住什么，帮他按这个标准做取舍。", "问他哪件杂事现在最占精力，能接就帮他接走。"], "roles": ["音", "悟", "戒", "沙", "僧", "龙"]}, {"title": "大家原定的交付时间突然提前，照原计划肯定做不完。你最先想到的是？", "choices": ["重排自己手上的步骤，先交能独立验收的部分。", "看谁手上同时压着几件急事，接过一件能立刻做的。", "把复杂流程压成简版，留出一点喘气的时间。", "把受影响的人拉到一起，让大家对齐先做什么、晚交什么。", "和相关的人确认，这次必须保住哪项要求。", "换条路，用一个小样先把核心做出来。"], "roles": ["沙", "龙", "戒", "音", "僧", "悟"]}, {"title": "忙了一周，周末只空出一个下午。没有急事催你，你更想怎么用这段时间？", "choices": ["挑一件马上能让我放松的事，痛快享受一下午。", "约一个最近有点误会的人坐下来，把话说开。", "留给那个一直想推进的计划，哪怕只往前走一点。 僧", "type": "记得为什么出发的人", "lead": "大家都在想怎么赶路，你习惯先确认这趟到底要去哪儿。", "paragraphs": ["时间紧起来，别人可能忙着删步骤，你会先问哪项要求一定得保住。朋友聚会越约越复杂，你也可能提醒大家，这次最想做的是给某个人过生日。那个最初说好的目标，在你这里通常还记得很清楚。", "你越在意一件事，越容易把原来的走法也一并守住。下次卡住，可以把「我想守住的」和「我愿意换的」各说一件，别人就知道哪里还有商量的余地。"], "quote": "路可以绕，想去的地方我还记得。"}, "龙": {"name": "白龙马", "type": "看见缺口就搭把手的人", "lead": "别人还没开口，你有时已经看见他手上多出来的那一件事。", "paragraphs": ["你未必最早认领一个显眼的位置。可到了快收摊的时候，你常会注意到还有人走不开，或者某件事一直没人接。你给的帮助往往很具体，比如把一趟来回接过去，或把临时少人的那一段顶起来。", "因为你常常顺手就做了，旁人有时不知道你也快排满了。说清楚「我可以接这件，另一件需要你们再找人」，你的好意才有余地持续。"], "quote": "我在队里，哪段缺人就喊我。"}, "音": {"name": "观音", "type": "让大家把话说到一处的人", "lead": "一群人都觉得自己说清楚了，你常能听出来他们其实在说两件事。", "paragraphs": ["比如两个人为了时间吵起来，一个怕迟到，另一个怕准备不完。你多半会先确认各自在担心什么，再找一个两边都能接住的安排。朋友来找你时，你也常会先弄清他想被听一会儿，还是想一起想办法。", "你有时忙着照顾每个人怎么想，最后忘了说自己的意见。等大家说完，也可以接一句「我希望事情最后是这样」，让你的需要也进到讨论里。"], "quote": "你俩先各说一句，我听听卡在哪儿。"}}}</script>
<script>
"use strict";
const byId = id => document.getElementById(id);
const { questions, roles } = JSON.parse(byId("quiz-data").textContent);
const answers = Array(questions.length).fill(null);
let current = 0;

function showSection(id, heading) {
  for (const section of ["cover", "quiz", "result"]) byId(section).hidden = section !== id;
  byId(heading).focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function updateProgress() {
  const count = answers.filter(answer => answer !== null).length;
  byId("answered").textContent = "已答 " + count + " 题";
  const progress = byId("progress");
  progress.setAttribute("aria-valuemax", questions.length);
  progress.setAttribute("aria-valuenow", count);
  progress.firstElementChild.style.width = (count / questions.length * 100) + "%";
}

function showQuestion() {
  const question = questions[current];
  byId("step").textContent = "第 " + (current + 1) + " 题 / 共 " + questions.length + " 题";
  byId("question-title").textContent = question.title;
  const choices = question.choices.map((text, index) => {
    const label = document.createElement("label");
    label.className = "choice";
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "answer";
    radio.value = index;
    radio.checked = answers[current] === index;
    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = "ABCDEF"[index];
    letter.setAttribute("aria-hidden", "true");
    const copy = document.createElement("span");
    copy.textContent = text;
    const indicator = document.createElement("span");
    indicator.className = "indicator";
    indicator.setAttribute("aria-hidden", "true");
    label.append(radio, letter, copy, indicator);
    return label;
  });
  byId("choices").replaceChildren(...choices);
  byId("previous").hidden = current === 0;
  byId("next").disabled = answers[current] === null;
  byId("next").textContent = current === questions.length - 1 ? "查看结果 →" : "下一题 →";
  updateProgress();
  showSection("quiz", "question-title");
}

function showResult() {
  const selected = answers.map((choice, index) => questions[index].roles[choice]);
  const totals = Object.fromEntries(Object.keys(roles).map(role => [role, 0]));
  for (const role of selected) totals[role]++;
  const max = Math.max(...Object.values(totals));
  const leaders = [...new Set([...selected].reverse())].filter(role => totals[role] === max);
  const [winner, ...others] = leaders;
  const result = roles[winner];
  const replayIndex = [8, 6, 3, 0].find(index => selected[index] === winner) ?? selected.lastIndexOf(winner);

  byId("result-name").textContent = result.name;
  byId("result-type").textContent = result.type;
  byId("result-seal").textContent = winner;
  byId("result-lead").textContent = result.lead;
  byId("replay-label").textContent = "第 " + (replayIndex + 1) + " 题，你选了";
  byId("replay-text").textContent = "「" + questions[replayIndex].choices[answers[replayIndex]] + "」";
  byId("result-detail").replaceChildren(...result.paragraphs.map(text => {
    const paragraph = document.createElement("p");
    paragraph.textContent = text;
    return paragraph;
  }));
  byId("quote").textContent = result.quote;
  byId("tie").hidden = others.length === 0;
  byId("tie").textContent = others.length
    ? "这次有 " + leaders.length + " 个角色并列最高，各有 " + max + " 次选择。其他并列角色是" + others.map(role => roles[role].name).join("、") + "。"
    : "";
  showSection("result", "result-name");
}

byId("start").addEventListener("click", showQuestion);
byId("choices").addEventListener("change", event => {
  answers[current] = Number(event.target.value);
  byId("next").disabled = false;
  updateProgress();
});
byId("previous").addEventListener("click", () => {
  if (current === 0) return;
  current--;
  showQuestion();
});
byId("question-form").addEventListener("submit", event => {
  event.preventDefault();
  if (answers[current] === null) return;
  if (current === questions.length - 1) {
    showResult();
    return;
  }
  current++;
  showQuestion();
});
byId("review").addEventListener("click", showQuestion);
byId("restart").addEventListener("click", () => {
  current = 0;
  answers.fill(null);
  showSection("cover", "cover-title");
});
</script>
</body>
